<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>6.2 Layout — Open House Newsletter Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F6FC;
  --panel:#FFFFFF;
  --ink:#16232F;
  --ink-soft:#4B5A6B;
  --accent:#2F6FED;
  --accent-deep:#1D4FBF;
  --accent-soft:#E1EBFC;
  --sky:#8EC6F5;
  --amber:#FFB443;
  --amber-soft:#FFF3DD;
  --coral:#FF5D5D;
  --coral-soft:#FFE6E6;
  --green:#1FAE7A;
  --green-soft:#DEF7EC;
  --muted:#7C8AA0;
  --line:#DAE5F3;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}

.deck{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;}
.progress-track{height:5px;width:100%;background:var(--line);flex-shrink:0;}
.progress-fill{height:100%;background:var(--accent);width:5.5%;transition:width .4s ease;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;flex-shrink:0;gap:12px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:600;}
.eyebrow .sub{color:var(--muted);font-weight:500;}
.topbar-right{display:flex;gap:8px;align-items:center;}
.icon-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}

.slides-viewport{flex:1;position:relative;overflow:hidden;}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:18px 6vw 90px;overflow-y:auto;
  opacity:0;pointer-events:none;transform:translateX(24px);
  transition:opacity .35s ease, transform .35s ease;
}
.slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
.slide-inner{max-width:920px;width:100%;margin:0 auto;padding-top:1.2vh;}

.kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px;}
.slide h1{font-size:clamp(26px,4vw,40px);margin:0 0 10px;line-height:1.08;}
.slide h1 span{color:var(--accent);}
.lead{font-size:16px;color:var(--ink-soft);line-height:1.55;max-width:70ch;}

/* Bottom nav */
.bottombar{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;background:linear-gradient(0deg,var(--paper) 60%,rgba(245,243,238,0));
  z-index:20;
}
.nav-btn{
  background:var(--ink);color:var(--paper);border:none;border-radius:999px;
  padding:11px 20px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;
}
.nav-btn.secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.nav-btn:disabled{opacity:.3;pointer-events:none;}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:340px;justify-content:center;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .25s ease;}
.dot.active{background:var(--accent);width:18px;border-radius:4px;}
.dot.done{background:var(--accent);opacity:.35;}

/* Cards & panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:720px){.grid2{grid-template-columns:1fr;}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:820px){.grid3{grid-template-columns:1fr;}}

/* Flip cards */
.flip-card{perspective:1200px;height:150px;cursor:pointer;}
.flip-card:hover .flip-front{transform:scale(1.015);}
.flip-front{transition:transform .2s ease;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;}
.flip-front{background:var(--accent-soft);border:1px solid #d6d4fb;}
.flip-back{background:var(--ink);color:var(--paper);transform:rotateY(180deg);}
.flip-front .term{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--accent);}
.flip-front .hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
.flip-back .def{font-size:13.5px;line-height:1.5;}
.flip-icon{position:absolute;top:12px;right:14px;font-size:11px;color:var(--muted);}

/* Ribbon mockup */
.ribbon{
  background:#fafafa;border:1px solid #d7d7d7;border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);overflow:visible;user-select:none;
  position:relative;
}
.ribbon-tabs{display:flex;gap:2px;background:#f0f0f0;border-bottom:1px solid #d7d7d7;padding:0 8px;border-radius:8px 8px 0 0;}
.ribbon-tab{padding:8px 14px;font-size:12.5px;color:#666;font-weight:500;}
.ribbon-tab.active{background:#fafafa;color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent);}
.ribbon-body{display:flex;align-items:stretch;padding:8px 12px;gap:2px;flex-wrap:wrap;border-radius:0 0 8px 8px;}
.rb-group{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 10px;border-right:1px solid #e5e5e5;position:relative;}
.rb-group:last-child{border-right:none;}
.rb-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px;border-radius:4px;font-size:10.5px;color:#333;transition:background .15s;}
.rb-btn .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.rb-group-label{font-size:9.5px;color:#999;margin-top:2px;}
.rb-btn.glow{background:#fff2d6;box-shadow:0 0 0 2px var(--amber);}
.rb-btn.active-click{background:var(--accent-soft);}

/* dropdown menu mockup */
.rb-dropdown{
  position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid #d0d0d0;
  border-radius:6px;box-shadow:0 10px 30px rgba(22,35,47,.22);z-index:200;min-width:190px;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .25s ease;
}
.rb-dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.rb-dropdown-item{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12px;color:#333;border-bottom:1px solid #f2f2f2;}
.rb-dropdown-item:last-child{border-bottom:none;}
.rb-dropdown-item.highlight{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--coral);}
.rb-dropdown-heading{padding:6px 12px 2px;font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;}
.cursor-dot{
  position:absolute;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle,rgba(70,64,222,.9),rgba(70,64,222,.15));
  pointer-events:none;z-index:40;opacity:0;transition:all .5s cubic-bezier(.4,.1,.2,1);
}
.cursor-dot.show{opacity:1;}

/* Demo block */
.demo-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:16px 0;overflow:visible;position:relative;}
.demo-caption{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center;}
.replay-btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;
  border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;margin-top:12px;
}
.replay-btn:hover{background:var(--accent-deep);}
.step-label{
  display:inline-block;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;
  font-size:11px;padding:4px 10px;border-radius:999px;margin-bottom:10px;
}

/* Document canvas mockup (newsletter preview) */
.doc-page{
  background:#fff;border:1px solid #ddd;box-shadow:0 4px 16px rgba(0,0,0,.08);
  width:220px;min-height:290px;padding:14px;position:relative;font-size:7px;line-height:1.4;color:#444;
  transition:all .5s ease;
}
.doc-page.landscape{width:290px;min-height:220px;}
.doc-page .doc-header{font-size:6px;color:#999;border-bottom:1px solid #eee;padding-bottom:4px;margin-bottom:6px;display:flex;justify-content:space-between;opacity:0;transition:opacity .4s;}
.doc-page.show-header .doc-header{opacity:1;}
.doc-page .doc-footer{position:absolute;bottom:8px;left:14px;right:14px;font-size:6px;color:#999;border-top:1px solid #eee;padding-top:3px;text-align:center;opacity:0;transition:opacity .4s;}
.doc-page.show-footer .doc-footer{opacity:1;}
.doc-page .doc-title{font-weight:700;font-size:9px;color:#222;margin-bottom:4px;}
.doc-page .doc-body{columns:1;column-gap:8px;}
.doc-page.two-col .doc-body{columns:2;}
.doc-page .doc-body p{margin:0 0 4px;}
.doc-pages-row{display:flex;gap:22px;align-items:flex-end;justify-content:center;flex-wrap:wrap;}
.doc-break-mark{font-size:6px;color:var(--coral);text-align:center;border-top:1px dashed var(--coral);border-bottom:1px dashed var(--coral);margin:5px 0;padding:1px 0;opacity:0;transition:opacity .4s;}
.doc-page.show-break .doc-break-mark{opacity:1;}

/* Table */
table.spec-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.spec-table th,table.spec-table td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;}
table.spec-table th{background:var(--accent-soft);color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.03em;}

/* Quiz */
.quiz-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
.quiz-q{font-weight:600;font-size:16px;margin-bottom:14px;}
.quiz-opt{
  display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 16px;margin-bottom:9px;font-size:14px;color:var(--ink);transition:all .15s;
}
.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt.correct{background:var(--green-soft);border-color:var(--green);}
.quiz-opt.wrong{background:var(--coral-soft);border-color:var(--coral);}
.quiz-opt.disabled{pointer-events:none;opacity:.55;}
.quiz-feedback{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.5;display:none;}
.quiz-feedback.show{display:block;}
.quiz-feedback.correct-fb{background:var(--green-soft);color:#0d6b48;}
.quiz-feedback.wrong-fb{background:var(--coral-soft);color:#a02c2c;}
.attempts-label{font-size:11.5px;color:var(--muted);margin-bottom:10px;}

/* Did you know */
.dyk-box{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:var(--radius);padding:18px 20px;}
.dyk-label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:#946200;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.dyk-bites{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.dyk-bite{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5;color:#5c4300;}
.dyk-bite .be-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.dyk-bite b{color:#3d2e00;}

/* Mini visual mockups for flip cards / examples */
.mini-examples{display:flex;gap:10px;margin-top:10px;}
.mini-doc{
  flex:1;background:#fff;border:1px solid #dde6f2;border-radius:8px;padding:8px;font-size:5.5px;line-height:1.3;color:#889;
  box-shadow:0 2px 8px rgba(22,35,47,.06);
}
.mini-doc .mini-label{font-size:8.5px;font-weight:700;color:var(--accent);margin-bottom:5px;font-family:'Space Grotesk',sans-serif;}
.mini-doc.single .mini-lines{display:block;}
.mini-doc.multi .mini-lines{columns:2;column-gap:5px;}
.mini-doc .bar{background:#eef3fb;height:4px;border-radius:2px;margin-bottom:3px;}
.mini-doc .bar.short{width:60%;}
.mini-tag{font-size:9.5px;color:var(--muted);text-align:center;margin-top:5px;}

/* Section-break visual mockup */
.sb-visual{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;}
.sb-mini-page{width:70px;height:92px;background:#fff;border:1.5px solid var(--accent);border-radius:5px;position:relative;box-shadow:0 2px 8px rgba(22,35,47,.08);}
.sb-mini-page.wide{width:92px;height:70px;}
.sb-mini-page .sb-fill{position:absolute;top:8px;left:8px;right:8px;bottom:8px;}
.sb-mini-page .sb-fill .bar{background:var(--accent-soft);height:5px;border-radius:2px;margin-bottom:4px;}
.sb-scissors{font-size:20px;color:var(--coral);}
.sb-labels{display:flex;justify-content:center;gap:34px;margin-top:8px;font-size:10.5px;color:var(--muted);font-weight:600;}

/* Mascot + gentle animation */
.mascot{
  display:inline-block;font-size:40px;animation:float 3.2s ease-in-out infinite;
  filter:drop-shadow(0 6px 10px rgba(47,111,237,.18));
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-3deg);}
  50%{transform:translateY(-8px) rotate(3deg);}
}
@keyframes wiggle{
  0%,100%{transform:rotate(0deg);}
  25%{transform:rotate(-4deg);}
  75%{transform:rotate(4deg);}
}
.wiggle-hover:hover{animation:wiggle .4s ease;}
@keyframes popIn{
  0%{transform:scale(.85);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
.slide.active .panel, .slide.active .flip-card, .slide.active .demo-block{animation:popIn .45s ease;}

/* Word practice banner */
.word-banner{
  display:flex;align-items:center;gap:14px;background:var(--green-soft);border:1px solid #b8e8d3;
  border-radius:var(--radius);padding:16px 18px;margin-top:16px;
}
.word-banner .wicon{width:38px;height:38px;flex-shrink:0;background:#185ABD;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Space Grotesk',sans-serif;font-size:16px;}
.word-banner .wtext{font-size:13.5px;color:#0d6b48;line-height:1.4;}
.word-banner .wtext b{color:#0a4d34;}

/* Glossary + Jump menu overlay */
.overlay{position:fixed;inset:0;background:rgba(23,24,28,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.overlay-panel{background:var(--panel);border-radius:20px;max-width:640px;width:100%;max-height:82vh;overflow-y:auto;padding:26px 26px 22px;}
.overlay-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.overlay-head h2{margin:0;font-size:20px;}
.close-x{background:var(--paper);border:none;border-radius:50%;width:32px;height:32px;font-size:16px;color:var(--ink-soft);}
.gloss-item{padding:14px 0;border-bottom:1px solid var(--line);}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--accent);font-size:15px;margin-bottom:3px;}
.gloss-def{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
.jump-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:6px;
  background:var(--paper);font-size:14px;font-weight:600;
}
.jump-item .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);background:var(--accent-soft);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.jump-item.section-head{background:transparent;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 4px 4px;}

/* misc */
.badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.03em;}
.badge.mission{background:var(--ink);color:var(--paper);}
.two-col-txt{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11px;color:#555;line-height:1.5;}
ul.plain{padding-left:18px;margin:0;font-size:14px;line-height:1.7;color:var(--ink-soft);}
ul.plain li strong{color:var(--ink);}
.outcome-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
.outcome-list li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--ink-soft);}
.outcome-list li .oc{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-weight:700;}
.slide-title-icon{font-size:34px;margin-bottom:10px;display:block;}
@media(max-width:640px){.slide{padding:14px 5vw 96px;} .grid3{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="deck">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="topbar">
    <div>
      <div class="eyebrow" id="eyebrowText">SECTION 1 OF 4 · MISSION BRIEFING</div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="openJump()">☰ Sections</button>
      <button class="icon-btn" onclick="openGlossary()">🔤 Glossary</button>
    </div>
  </div>

  <div class="slides-viewport" id="viewport">
    <!-- SLIDES INJECTED BELOW -->
  </div>

  <div class="bottombar">
    <button class="nav-btn secondary" id="prevBtn" onclick="go(-1)">← Back</button>
    <div class="dots" id="dotsWrap"></div>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>

<!-- GLOSSARY OVERLAY -->
<div class="overlay" id="glossOverlay">
  <div class="overlay-panel">
    <div class="overlay-head">
      <h2>📖 Glossary — 6.2 Layout</h2>
      <button class="close-x" onclick="closeOverlay('glossOverlay')">✕</button>
    </div>
    <div id="glossList"></div>
  </div>
</div>

<!-- JUMP MENU OVERLAY -->
<div class="overlay" id="jumpOverlay">
  <div class="overlay-panel">
    <div class="overlay-head">
      <h2>Jump to a section</h2>
      <button class="close-x" onclick="closeOverlay('jumpOverlay')">✕</button>
    </div>
    <div id="jumpList"></div>
  </div>
</div>

<script>
/* ============================================================
   DATA: glossary + section map
   ============================================================ */
const GLOSSARY = [
  {term:"Column", def:"A vertical block of text. A single-column layout runs text across the full page width; a multi-column layout splits it into two or more side-by-side blocks, like a newspaper or newsletter."},
  {term:"Header", def:"A reserved space at the TOP of every page, used to display information such as a title, date, author, or logo."},
  {term:"Footer", def:"A reserved space at the BOTTOM of every page, used to display information such as a page number or document title."},
  {term:"Page number", def:"Consecutive numbers assigned to each page of a document, usually placed in a header or footer."},
  {term:"Page break", def:"A break in the document that separates its content into different pages. Can be automatic (the word processor does it for you) or manual (you insert it yourself)."},
  {term:"Section break", def:"A break used to separate parts of a document so that different formatting or layouts — such as columns, orientation, or headers/footers — can be applied to each part independently."},
  {term:"Page orientation", def:"The way a page is held for reading — either Portrait (taller than wide) or Landscape (wider than tall)."},
];

const SECTIONS = [
  {label:"Mission Briefing", start:0, end:1},
  {label:"6.2.1 Columns", start:2, end:5},
  {label:"6.2.2 Headers, Footers & Page Numbers", start:6, end:10},
  {label:"6.2.3 Page & Section Breaks", start:11, end:17},
];

/* ============================================================
   SLIDE MARKUP
   ============================================================ */
const slideHTML = [];

// SLIDE 0 — Title / Mission Briefing
slideHTML.push(`
<div class="slide-inner">
  <span class="mascot slide-title-icon">📰</span>
  <div class="badge mission">MISSION FILE · 6.2 LAYOUT</div>
  <h1 style="margin-top:14px;">Build the <span>Open House Newsletter</span></h1>
  <p class="lead">Your school's Open House is in two weeks, and the newsletter committee needs a 2-page handout: a welcome page introducing the school, and a schedule page listing every event. Over this mission you'll learn the exact Word skills needed to lay it out properly — columns, headers &amp; footers, page numbers, and page/section breaks (including flipping a page sideways for a wide timetable).</p>
  <div class="panel" style="margin-top:20px;">
    <div class="doc-pages-row">
      <div style="text-align:center;">
        <div class="doc-page" id="titlePreviewP1">
          <div class="doc-header"><span>OPEN HOUSE 2026</span><span>Riverside Secondary</span></div>
          <div class="doc-title">Welcome to Our Open House!</div>
          <div class="doc-body">

/* ============================================================
   NAVIGATION
   ============================================================ */
let current = 0;
const total = slideHTML.length;

function buildDots(){
  const wrap = document.getElementById('dotsWrap');
  wrap.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='dot';
    d.onclick=()=>{current=i;render();};
    wrap.appendChild(d);
  }
}
buildDots();

function currentSectionInfo(){
  for(let i=0;i<SECTIONS.length;i++){
    if(current>=SECTIONS[i].start && current<=SECTIONS[i].end){
      return {idx:i+1, total:SECTIONS.length, label:SECTIONS[i].label};
    }
  }
  return {idx:1,total:SECTIONS.length,label:SECTIONS[0].label};
}

function render(){
  document.querySelectorAll('.slide').forEach((s,i)=>{
    s.classList.toggle('active', i===current);
  });
  document.getElementById('progressFill').style.width = (((current+1)/total)*100)+'%';
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d,i)=>{
    d.classList.toggle('active', i===current);
    d.classList.toggle('done', i<current);
  });
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').textContent = current===total-1 ? '🎉 Done' : 'Next →';
  const info = currentSectionInfo();
  document.getElementById('eyebrowText').textContent = `SECTION ${info.idx} OF ${info.total} · ${info.label.toUpperCase()}`;
  window.scrollTo(0,0);
}
function go(dir){
  current = Math.max(0, Math.min(total-1, current+dir));
  render();
}
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
render();

function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

/* ============================================================
   QUIZ LOGIC (2 attempts)
   ============================================================ */
document.querySelectorAll('.quiz-box').forEach(box=>{
  let attempts = 0;
  const opts = box.querySelectorAll('.quiz-opt');
  const fb = box.querySelector('.quiz-feedback');
  opts.forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(opt.classList.contains('disabled') || box.dataset.solved) return;
      attempts++;
      const isCorrect = opt.dataset.correct === 'true';
      if(isCorrect){
        opt.classList.add('correct');
        opts.forEach(o=>o.classList.add('disabled'));
        fb.textContent = "✅ Correct! " + (attempts>1 ? "Nice recovery." : "Got it first try.");
        fb.className='quiz-feedback show correct-fb';
        box.dataset.solved = "true";
      } else {
        opt.classList.add('wrong');
        opt.classList.add('disabled');
        if(attempts>=2){
          opts.forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct'); o.classList.add('disabled'); });
          fb.textContent = "The correct answer is highlighted above. Review this section if needed before moving on.";
          fb.className='quiz-feedback show wrong-fb';
          box.dataset.solved = "true";
        } else {
          fb.textContent = "Not quite — you have 1 more try.";
          fb.className='quiz-feedback show wrong-fb';
        }
      }
    });
  });
});

function moveCursor(cursorEl, targetEl, containerEl){
  const cRect = containerEl.getBoundingClientRect();
  const tRect = targetEl.getBoundingClientRect();
  const x = tRect.left - cRect.left + tRect.width/2 - 8;
  const y = tRect.top - cRect.top + tRect.height/2 - 8;
  cursorEl.style.left = x+'px';
  cursorEl.style.top = y+'px';
  cursorEl.classList.add('show');
}

async function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function playColumnsDemo(){
  const label = document.getElementById('colStepLabel');

  const cursor = document.getElementById('colCursor');
  const tab = document.getElementById('colLayoutTab');
  const btn = document.getElementById('colBtn');
  const dropdown = document.getElementById('colDropdown');
  const twoItem = document.getElementById('colTwoItem');
  const preview = document.getElementById('colDocPreview');

  dropdown.classList.remove('open'); btn.classList.remove('active-click'); preview.classList.remove('two-col');
  label.textContent = "Step 1 — Select the text, then open the Layout tab";
  moveCursor(cursor, tab, ribbon);
  await wait(900);
  label.textContent = "Step 2 — Click Columns in the Page Setup group";
  moveCursor(cursor, btn, ribbon);
  await wait(900);
  btn.classList.add('active-click');
  dropdown.classList.add('open');
  await wait(700);
  label.textContent = "Step 3 — Choose 'Two'";
  moveCursor(cursor, twoItem, ribbon);
  twoItem.classList.add('highlight');
  await wait(900);
  label.textContent = "Result — text re-flows into two columns instantly";
  preview.classList.add('two-col');
  await wait(600);
  cursor.classList.remove('show');
  twoItem.classList.remove('highlight');
  dropdown.classList.remove('open');
  btn.classList.remove('active-click');
}
